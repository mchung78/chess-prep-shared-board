<style>
/*
  Defined locally rather than assumed from a host stylesheet - confirmed
  2026-09-06 that when this file is served as a plain static page (e.g.
  present_files, outside the visualize:show_widget Artifact sandbox),
  there is no host CSS supplying .sr-only or any --text-*/--border-*
  custom properties, so the accessibility heading below rendered as
  large visible text and every var(--...) color fell back to browser
  default. Every var(--...) usage in this file now carries an explicit

  real values still win.

.sr-only { position:absolute !important; width:1px !important; height:1px !important; padding:0 !important; margin:-1px !important; overflow:hidden !important; clip:rect(0,0,0,0) !important; clip-path:inset(50%) !important; white-space:nowrap !important; border:0 !important; }

<div style="padding: 1rem 0;">
<h2 class="sr-only" style="position:absolute !important; width:1px !important; height:1px !important; padding:0 !important; margin:-1px !important; overflow:hidden !important; clip:rect(0,0,0,0) !important; clip-path:inset(50%) !important; white-space:nowrap !important; border:0 !important;">Interactive chess board for studying positions and sending them to Claude</h2>

<script>
/*
  Set to a full 6-field FEN or this project's 4-field positionKey to
  preload a position; leave '' for the starting position. Routed through
  normalizeFen() (defined below - function declarations are hoisted, so
  the forward reference is safe) rather than passed to new Chess()
  directly: a bare positionKey passed straight to the constructor
  silently fails to load in chess.js 0.10.3 (confirmed live 2026-09-06 -
  produced an empty board with no pieces, no error), which is exactly
  why the Load-FEN button already normalizes first. This is the single
  line to edit when preloading a position - don't touch the line below.
*/
var INITIAL_FEN = '';
var game = INITIAL_FEN ? new Chess(normalizeFen(INITIAL_FEN)) : new Chess();
var STANDARD_FEN = new Chess().fen();
var baseFen = game.fen();
var selected = null;
var flipped = false;
var dragCtx = null;  // { fromSq, startX, startY, moved, ghostEl, hoverSq } while a custom drag is in progress
var boardEl = document.getElementById('board');
var ranksEl = document.getElementById('ranks');
var filesEl = document.getElementById('files');
var turnLabel = document.getElementById('turnLabel');
var moveListEl = document.getElementById('moveList');
var fenInput = document.getElementById('fenInput');
var fenError = document.getElementById('fenError');
var syncStatusEl = document.getElementById('syncStatus');
var authRowEl = document.getElementById('authRow');
var authBtnEl = document.getElementById('authBtn');
var authStatusEl = document.getElementById('authStatus');

/*
  Live shared-board sync (issues #385/#387). Reads are public, but writes
  require Firebase Authentication plus the server-side UID allowlist chosen
  in #388. Last-write-wins is intentional for this single-board experiment.

  These config values are NOT secrets by design - they identify the
  Firebase project, they don't grant privileged access. The actual
  access gate is the database's security rules (see rules.json in this
  repo's root), which requires an authenticated allowlisted UID and restricts state to
  exactly {schemaVersion, baseFen, currentFen, movesSan, updatedAt} with
  bounded field sizes, independent of whether this config is public. Don't treat filling this in as something that needs hiding.
*/
var firebaseConfig = {
  apiKey: "AIzaSyBJo0j6enFcBCHEc3kAa_L2BwlIMJWTRvg",
  authDomain: "chess-prep-sync.firebaseapp.com",
  databaseURL: "https://chess-prep-sync-default-rtdb.firebaseio.com",
  projectId: "chess-prep-sync",
  storageBucket: "chess-prep-sync.firebasestorage.app",
  messagingSenderId: "785376461633",
  appId: "1:785376461633:web:d9d86f5562c7fd36aa57c0"
};
var boardRef = null;
var firebaseReady = false;
try {
  if (firebaseConfig.apiKey !== 'REPLACE_ME') {
    firebase.initializeApp(firebaseConfig);
    boardRef = firebase.database().ref('board/state');
    firebaseReady = true;
  }
} catch (e) {
  console.warn('Firebase sync not available - running local-only.', e);
}

/*
  Sign-in (issue #388). Reads never required auth - this is purely so a
  write attempt has a UID for the server-side rules to check against
  admin/authorizedWriters. Being signed in is necessary but not
  sufficient to write: the client has no way to know whether its own
  UID is on the allowlist (admin/* is unreadable by design - see
  rules.json), so "signed in" and "authorized to write" are shown as
  separate states, distinguished only by whether an actual write
  succeeds or comes back permission-denied.
*/
var currentUser = null;
function updateAuthUI() {
  if (!authBtnEl || !authStatusEl) return;
  if (currentUser) {
    authBtnEl.textContent = 'Sign out';
    authStatusEl.textContent = 'Signed in as ' + (currentUser.email || currentUser.uid);
  } else {
    authBtnEl.textContent = 'Sign in with Google';
    authStatusEl.textContent = 'Sign in to move pieces for everyone watching';
  }
}
if (firebaseReady) {
  if (authRowEl) authRowEl.style.display = 'flex';
  firebase.auth().onAuthStateChanged(function(user) {
    currentUser = user;
    updateAuthUI();
  });
  if (authBtnEl) {
    authBtnEl.addEventListener('click', function() {
      if (currentUser) {
        firebase.auth().signOut();
        return;
      }
      firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e) {
        console.warn('Sign-in failed', e);
        if (authStatusEl) authStatusEl.textContent = 'Sign-in failed - try again';

    });
  }
  updateAuthUI();
}
var listenerHealthy = false;
function setSyncStatus(state, detail) {
  if (!syncStatusEl) return;
  var labels = { local: 'local only', connecting: 'connecting', synced: 'synced', error: 'sync error' };
  syncStatusEl.textContent = '(' + labels[state] + (detail ? ': ' + detail : '') + ')';
}
setSyncStatus(firebaseReady ? 'connecting' : 'local', firebaseReady ? '' : 'not configured');

/*
  Move list, not FEN alone, is the reconstruction source: chess.js
  doesn't rebuild move history from a bare loaded FEN, so replaying the
  SAN move list is what lets other viewers see a real move list (and
  correct undo/turn state), not just a static final position. FEN is
  still stored alongside it - useful on its own (e.g. pasting into the
  existing Load-FEN box) and as the fallback for the one case move
  replay can't handle: a custom position loaded via that same Load-FEN
  box has no move history to replay in the first place, exactly
  mirroring the pre-existing local-only quirk noted at loadFenBtn below.
*/
/* TASK_387_STATE_CODEC_START - kept pure so the deterministic Node tests can extract it. */
var STATE_SCHEMA_VERSION = 1;
var STATE_FIELDS = ['baseFen', 'currentFen', 'movesSan', 'schemaVersion', 'updatedAt'];
var MAX_FEN_LENGTH = 100;
var MAX_MOVES_LENGTH = 10000;
var MAX_PLIES = 1000;

function parseFen(value, label) {

    throw new Error(label + ' must be a 1-100 character FEN');
  }

  var parsedCurrent = parseFen(activeGame.fen(), 'Current FEN');

  if (moves.length > MAX_PLIES) throw new Error('Move history exceeds 1000 plies');
  var movesSan = moves.join(' ');
  if (movesSan.length > MAX_MOVES_LENGTH) throw new Error('Move history exceeds 10000 characters');

    schemaVersion: STATE_SCHEMA_VERSION,
    baseFen: parsedBase.fen,
    currentFen: parsedCurrent.fen,

  }

    throw new Error('Unsupported remote state version');
  }
  if (typeof data.updatedAt !== 'number' || !Number.isFinite(data.updatedAt)) {
    throw new Error('Remote timestamp is invalid');

  if (typeof data.movesSan !== 'string' || data.movesSan.length > MAX_MOVES_LENGTH) {

function pushSharedState() {

  var payload;

    payload = serializeSharedState(game, baseFen, firebase.database.ServerValue.TIMESTAMP);
  } catch (e) {
    setSyncStatus('error', e.message);
    return;
  }
  boardRef.set(payload).then(function() {

var pieceSvgUid = 0;
function pieceSvg(piece) {
  var key = (piece.color === 'w' ? 'w' : 'b') + piece.type.toUpperCase();
  var raw = PIECE_SVG[key];
  if (!raw) return '';
  pieceSvgUid += 1;
  var uid = 'pg' + pieceSvgUid;
  return raw.replace(/id="a"/g, 'id="' + uid + '"').replace(/url\(#a\)/g, 'url(#' + uid + ')');
}

function squareId(file, rank) {
  return String.fromCharCode(97 + file) + rank;
}

function normalizeFen(value) {
  var fields = value.split(/\s+/).filter(Boolean);
  if (fields.length === 4) {
    fields.push('0', '1');
  }
  return fields.join(' ');
}

function renderCoords() {
  ranksEl.innerHTML = '';
  filesEl.innerHTML = '';
  for (var r = 0; r < 8; r++) {
    var rankNum = flipped ? r + 1 : 8 - r;
    var rEl = document.createElement('div');
    rEl.textContent = rankNum;
    rEl.style.height = '44px';
    rEl.style.display = 'flex';
    rEl.style.alignItems = 'center';
    rEl.style.fontSize = '12px';
    rEl.style.color = 'var(--text-muted, #999)';
    ranksEl.appendChild(rEl);
  }
  for (var f = 0; f < 8; f++) {
    var fileLetter = String.fromCharCode(97 + (flipped ? 7 - f : f));
    var fEl = document.createElement('div');
    fEl.textContent = fileLetter;
    fEl.style.width = '44px';
    fEl.style.textAlign = 'center';
    fEl.style.fontSize = '12px';
    fEl.style.color = 'var(--text-muted, #999)';
    filesEl.appendChild(fEl);
  }
}

function attemptMove(from, to) {
  var moves = game.moves({ square: from, verbose: true });
  var isLegal = moves.some(function(m) { return m.to === to; });
  if (!isLegal) return false;
  game.move({ from: from, to: to, promotion: 'q' });
  return true;
}

/*
  Custom mouse-driven drag-and-drop, replacing an earlier native HTML5
  draggable/dragstart/drop implementation (removed 2026-09-05). Native
  HTML5 DnD has real, well-documented rough edges for exactly this kind
  of UI - drag-image sizing/generation is browser-dependent (especially
  for percentage-sized SVG content, which is what PIECE_SVG uses),
  there's no built-in hook for a live "square under cursor" hover state,
  and the drag-image itself can't easily be styled to match the actual
  piece rendering. This is why Lichess's own board library (chessground)
  doesn't use native HTML5 DnD either - it tracks mousedown/mousemove/
  mouseup manually with a floating absolutely-positioned piece, which is
  what this implementation does too. It also sidesteps the earlier
  DOM-teardown-mid-drag bug entirely: there's no browser-native drag
  session tied to a specific DOM node to break, so render() is safe to
  call at any point.

  A small movement threshold (DRAG_THRESHOLD_PX) distinguishes a real
  drag from a plain click - below it, the mouseup falls through to the
  ordinary `click` event and existing onSquareClick()/cell.onclick
  handling, unchanged. Above it, this code takes over entirely: the
  piece is hidden at its origin square (replaced with a highlight tint,
  not a literal ghost image of the piece) and a floating clone follows
  the cursor until mouseup, which computes the square under the pointer
  and attempts the move there.
*/
var DRAG_THRESHOLD_PX = 4;

function startCustomDrag(fromSq, startX, startY) {
  dragCtx = { fromSq: fromSq, startX: startX, startY: startY, moved: false, ghostEl: null, hoverSq: null };
  document.addEventListener('mousemove', onCustomDragMove);
  document.addEventListener('mouseup', onCustomDragUp);
}

function createGhostEl(sq) {
  var piece = game.get(sq);
  var el = document.createElement('div');
  el.style.position = 'fixed';
  el.style.width = '44px';
  el.style.height = '44px';
  el.style.pointerEvents = 'none';  // critical: lets elementFromPoint() see the real cell/square underneath, not the ghost itself
  el.style.zIndex = '1000';
  el.style.display = 'flex';
  el.style.alignItems = 'center';
  el.style.justifyContent = 'center';
  el.innerHTML = pieceSvg(piece);
  return el;
}

function positionGhost(el, x, y) {
  el.style.left = (x - 22) + 'px';  // center the 44px ghost on the cursor
  el.style.top = (y - 22) + 'px';
}

function squareAtPoint(x, y) {
  var el = document.elementFromPoint(x, y);
  while (el && !el.dataset.square) el = el.parentElement;
  return el ? el.dataset.square : null;
}

function showHoverHighlight(sq) {
  hideHoverHighlight();
  var cellEl = boardEl.querySelector('[data-square="' + sq + '"]');
  if (!cellEl) return;
  var el = document.createElement('div');
  el.className = 'hover-highlight';
  el.style.position = 'absolute';
  el.style.left = cellEl.offsetLeft + 'px';
  el.style.top = cellEl.offsetTop + 'px';
  el.style.width = '44px';
  el.style.height = '44px';
  el.style.background = HIGHLIGHT_COLOR;
  el.style.pointerEvents = 'none';
  boardEl.appendChild(el);
}

function hideHoverHighlight() {
  var el = boardEl.querySelector('.hover-highlight');
  if (el) el.remove();
}

function onCustomDragMove(ev) {
  if (!dragCtx) return;
  if (!dragCtx.moved) {
    var dx = ev.clientX - dragCtx.startX, dy = ev.clientY - dragCtx.startY;
    if (Math.sqrt(dx * dx + dy * dy) < DRAG_THRESHOLD_PX) return;
    dragCtx.moved = true;
    selected = dragCtx.fromSq;
    render();  // safe here - no native drag session tied to a DOM node to break
    dragCtx.ghostEl = createGhostEl(dragCtx.fromSq);
    document.body.appendChild(dragCtx.ghostEl);
  }
  positionGhost(dragCtx.ghostEl, ev.clientX, ev.clientY);
  var sq = squareAtPoint(ev.clientX, ev.clientY);
  if (sq !== dragCtx.hoverSq) {
    dragCtx.hoverSq = sq;
    if (sq) { showHoverHighlight(sq); } else { hideHoverHighlight(); }
  }
}

function onCustomDragUp(ev) {
  document.removeEventListener('mousemove', onCustomDragMove);
  document.removeEventListener('mouseup', onCustomDragUp);
  if (!dragCtx) return;
  var wasMoved = dragCtx.moved;
  var fromSq = dragCtx.fromSq;
  var dropSq = dragCtx.hoverSq;
  if (dragCtx.ghostEl) dragCtx.ghostEl.remove();
  hideHoverHighlight();
  dragCtx = null;
  if (!wasMoved) return;  // below the movement threshold - let the ordinary click event handle it
  selected = null;
  var moved = false;
  if (dropSq && dropSq !== fromSq) { moved = attemptMove(fromSq, dropSq); }
  render();
  if (moved) pushSharedState();
}

function render() {
  boardEl.innerHTML = '';
  renderCoords();
  var board = game.board();
  for (var r = 0; r < 8; r++) {
    for (var f = 0; f < 8; f++) {
      var boardRow = flipped ? 7 - r : r;
      var boardCol = flipped ? 7 - f : f;
      var rank = 8 - boardRow;
      var file = boardCol;
      var sq = squareId(file, rank);
      var isLight = (r + f) % 2 === 0;
      var cell = document.createElement('div');
      cell.dataset.square = sq;
      cell.style.width = '44px';
      cell.style.height = '44px';
      cell.style.display = 'flex';
      cell.style.alignItems = 'center';
      cell.style.justifyContent = 'center';
      cell.style.position = 'relative';
      cell.style.cursor = 'pointer';
      cell.style.background = isLight ? LIGHT_SQUARE : DARK_SQUARE;
      var piece = board[boardRow][boardCol];
      var isDragSource = dragCtx && dragCtx.moved && dragCtx.fromSq === sq;
      if (isDragSource) {
        var ghostTint = document.createElement('div');
        ghostTint.style.position = 'absolute';
        ghostTint.style.inset = '0';
        ghostTint.style.background = HIGHLIGHT_COLOR;
        cell.appendChild(ghostTint);
      } else if (piece) {
        var span = document.createElement('span');
        span.innerHTML = pieceSvg(piece);
        span.style.display = 'flex';
        span.style.alignItems = 'center';
        span.style.justifyContent = 'center';
        span.style.width = PIECE_SIZE + 'px';
        span.style.height = PIECE_SIZE + 'px';
        span.style.userSelect = 'none';
        span.dataset.fromSquare = sq;
        span.style.cursor = 'pointer';
        span.onmousedown = (function(fromSq) {
          return function(ev) {
            var p = game.get(fromSq);
            if (!p || p.color !== game.turn()) return;
            ev.preventDefault();
            startCustomDrag(fromSq, ev.clientX, ev.clientY);
          };
        })(sq);
        cell.appendChild(span);
      }
      if (selected === sq && !(dragCtx && dragCtx.moved)) {
        cell.style.boxShadow = 'inset 0 0 0 2px var(--border-accent, #4a9eff)';
      }
      cell.onclick = (function(sq) { return function() { onSquareClick(sq); }; })(sq);
      boardEl.appendChild(cell);
    }
  }
  if (selected) {
    var moves = game.moves({ square: selected, verbose: true });
    for (var i = 0; i < moves.length; i++) {
      var dest = boardEl.querySelector('[data-square="' + moves[i].to + '"]');
      if (!dest) continue;
      var marker = document.createElement('div');
      if (moves[i].flags.indexOf('c') !== -1 || moves[i].flags.indexOf('e') !== -1) {
        marker.style.position = 'absolute';
        marker.style.inset = '3px';
        marker.style.border = '3px solid var(--text-danger, #f66)';
        marker.style.borderRadius = '50%';
        marker.style.boxSizing = 'border-box';
      } else {
        marker.style.position = 'absolute';
        marker.style.width = '12px';
        marker.style.height = '12px';
        marker.style.borderRadius = '50%';
        marker.style.background = 'var(--text-muted, #999)';
      }
      dest.appendChild(marker);
    }
  }
  turnLabel.textContent = (game.turn() === 'w' ? 'White' : 'Black') + ' to move' + (game.in_checkmate() ? ' - checkmate' : game.in_check() ? ' - check' : '');
  var hist = game.history();
  if (hist.length === 0) {
    moveListEl.textContent = 'Start position';
  } else {
    var parts = [];
    for (var i = 0; i < hist.length; i += 2) {
      var num = (i / 2) + 1;
      parts.push(num + '. ' + hist[i] + (hist[i+1] ? ' ' + hist[i+1] : ''));
    }
    moveListEl.textContent = parts.join('  ');
  }
}

function onSquareClick(sq) {
  var piece = game.get(sq);
  if (selected) {
    if (selected === sq) { selected = null; render(); return; }
    if (attemptMove(selected, sq)) {
      selected = null;
      render();
      pushSharedState();
      return;
    }
  }
  if (piece && piece.color === game.turn()) {
    selected = sq;
  } else {
    selected = null;
  }
  render();
}

document.getElementById('resetBtn').onclick = function() {
  game = new Chess();
  baseFen = STANDARD_FEN;
  selected = null;
  fenError.style.display = 'none';
  render();
  pushSharedState();
};

document.getElementById('undoBtn').onclick = function() {
  game.undo();
  selected = null;
  render();
  pushSharedState();
};

document.getElementById('flipBtn').onclick = function() {
  flipped = !flipped;
  render();
};

document.getElementById('loadFenBtn').onclick = function() {
  var raw = fenInput.value.trim();
  if (!raw) { fenError.textContent = 'Enter a FEN or positionKey first.'; fenError.style.display = 'block'; return; }
  var value = normalizeFen(raw);
  var test = new Chess();
  var ok = test.load(value);
  if (!ok) { fenError.textContent = "That didn't parse. Check it and try again."; fenError.style.display = 'block'; return; }
  game = test;
  baseFen = test.fen();
  selected = null;
  fenError.style.display = 'none';
  render();
  pushSharedState();
};

document.getElementById('discussBtn').onclick = function() {
  var hist = game.history();
  var moveText = hist.length ? hist.join(' ') : '(no moves yet)';
  var message = 'Here is our shared board. Moves so far: ' + moveText + '. Current FEN: ' + game.fen() + '. What do you think?';
  /*
    sendPrompt is injected by the visualize:show_widget Artifact sandbox
    only. Confirmed live 2026-09-06 that a plain served/previewed file
    (present_files, or this file published/opened outside that sandbox)
    has neither that global nor working Clipboard-API/window.prompt
    fallbacks: the sandboxed preview iframe blocks clipboard-write via
    Permissions-Policy AND ignores prompt()/alert()/confirm() outright
    (no 'allow-modals'). The only thing guaranteed to work everywhere is
    an in-page, pre-selected, read-only textarea the person copies from
    with their own Ctrl/Cmd+C - that's a real user-initiated clipboard
    action, not a scripted one, so it isn't subject to the same policy.
  */
  if (typeof sendPrompt === 'function') {
    sendPrompt(message);
    return;
  }
  var box = document.getElementById('discussBox');
  var text = document.getElementById('discussText');
  box.style.display = 'block';
  text.value = message;
  text.focus();
  text.select();
};

render();
</script>
